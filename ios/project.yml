# Generates Auvel.xcodeproj. Run `xcodegen generate` in this folder. See docs/phase-2/adr/ADR-001.
name: Auvel
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  AuvelKit:
    path: ../shared
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
targets:
  Auvel:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: AuvelKit
        product: AuvelProtocol
      - package: AuvelKit
        product: AuvelTransport
      - package: AuvelKit
        product: AuvelSession
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Auvel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: Auvel uses your local network to find and control your Mac. Nothing leaves your network.
        NSBonjourServices:
          - _auvel._tcp
          - _auvel-pair._tcp
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Auvel
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.touchbase.auvel
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AuvelTests
        - AuvelUITests
      gatherCoverageData: true
  # T4 snapshot tests. Hosted in the app so @testable import works.
  AuvelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
    dependencies:
      - target: Auvel
      - package: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.touchbase.auvel.tests
  # T3 UI tests against the mock Mac (T5).
  AuvelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Auvel
      - package: AuvelKit
        product: AuvelTestSupport
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.touchbase.auvel.uitests
        TEST_TARGET_NAME: Auvel
