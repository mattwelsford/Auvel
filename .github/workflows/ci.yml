name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared package (build + test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --package-path shared
      - name: Test with coverage
        run: swift test --package-path shared --enable-code-coverage
      - name: Coverage report (T1, minimum 80% of lines in shared sources)
        working-directory: shared
        run: |
          PROFDATA=$(find .build -name default.profdata | head -1)
          BIN="$(swift build --show-bin-path)/AuvelKitPackageTests.xctest/Contents/MacOS/AuvelKitPackageTests"
          xcrun llvm-cov report "$BIN" -instr-profile "$PROFDATA" -ignore-filename-regex='(Tests|\.build)/' | tee coverage.txt
          LINES=$(awk '/^TOTAL/ {print $10}' coverage.txt | tr -d '%')
          { echo "### Shared package line coverage: ${LINES}%"; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$LINES" 'BEGIN { exit (c >= 80) ? 0 : 1 }' || { echo "::error::Line coverage ${LINES}% is below 80%"; exit 1; }
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-coverage
          path: shared/coverage.txt
          if-no-files-found: ignore

  app:
    name: ${{ matrix.name }} app (build)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            dir: mac
            project: AuvelMac.xcodeproj
            scheme: AuvelMac
            destination: generic/platform=macOS
          - name: iPhone
            dir: ios
            project: Auvel.xcodeproj
            scheme: Auvel
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ${{ matrix.dir }}
        run: xcodegen generate
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          xcodebuild build -quiet \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO
