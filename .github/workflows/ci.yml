name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared package (build + test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --package-path shared
      - name: Test with coverage
        run: swift test --package-path shared --enable-code-coverage
      - name: Coverage report (T1, minimum 80% of lines in shared sources)
        working-directory: shared
        run: |
          PROFDATA=$(find .build -name default.profdata | head -1)
          BIN="$(swift build --show-bin-path)/AuvelKitPackageTests.xctest/Contents/MacOS/AuvelKitPackageTests"
          xcrun llvm-cov report "$BIN" -instr-profile "$PROFDATA" -ignore-filename-regex='(Tests|\.build)/' | tee coverage.txt
          LINES=$(awk '/^TOTAL/ {print $10}' coverage.txt | tr -d '%')
          { echo "### Shared package line coverage: ${LINES}%"; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$LINES" 'BEGIN { exit (c >= 80) ? 0 : 1 }' || { echo "::error::Line coverage ${LINES}% is below 80%"; exit 1; }
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shared-coverage
          path: shared/coverage.txt
          if-no-files-found: ignore

  app:
    name: ${{ matrix.name }} app (build)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            dir: mac
            project: AuvelMac.xcodeproj
            scheme: AuvelMac
            destination: generic/platform=macOS
          - name: iPhone
            dir: ios
            project: Auvel.xcodeproj
            scheme: Auvel
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ${{ matrix.dir }}
        run: xcodegen generate
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          xcodebuild build -quiet \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO

  ios-tests:
    name: iPhone tests (snapshots T4, UI flows T3)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Pick the newest iPhone Pro simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.split(".iOS-")[1].split("-"))
              for d in devices:
                  if d["name"].startswith("iPhone") and d["name"].endswith("Pro"):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1])
          print("Simulator:", best[2], best[0], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: ios
        run: |
          xcodebuild test -quiet \
            -project Auvel.xcodeproj \
            -scheme Auvel \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Print test failures
        if: failure()
        working-directory: ios
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact | python3 -c '
          import json, sys
          def walk(node, path):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print(" / ".join(path), "->", name)
              here = path + [name] if node.get("nodeType") in ("Test Case", "Test Suite") else path
              for child in node.get("children", []):
                  walk(child, here)
          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node, [])
          '
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-snapshots
          path: ios/Tests/Unit/__Snapshots__
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore

  pairing-e2e:
    name: Pairing end to end (iPhone simulator with real Mac app)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate projects
        run: |
          (cd mac && xcodegen generate)
          (cd ios && xcodegen generate)
      - name: Build Mac app (Debug, ad hoc signed)
        working-directory: mac
        run: |
          xcodebuild build -quiet \
            -project AuvelMac.xcodeproj -scheme AuvelMac -configuration Debug \
            -destination generic/platform=macOS -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Launch Mac app with pairing open
        working-directory: mac
        run: |
          APP=$(find build/Build/Products/Debug -maxdepth 1 -name '*.app' | head -1)
          echo "Launching $APP"
          open -n "$APP" --args -AuvelE2EPasskey 123456
          sleep 5
          pgrep -fl AuvelMac || { echo "::error::Mac app is not running"; exit 1; }
          echo "Computer name: $(scutil --get ComputerName)"
          dns-sd -B _auvel-pair._tcp & sleep 3; kill $! || true
      - name: Pick the newest iPhone Pro simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.split(".iOS-")[1].split("-"))
              for d in devices:
                  if d["name"].startswith("iPhone") and d["name"].endswith("Pro"):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Pair and connect from the simulator
        working-directory: ios
        run: |
          export TEST_RUNNER_AUVEL_E2E_MAC_NAME="$(scutil --get ComputerName)"
          xcodebuild test -quiet \
            -project Auvel.xcodeproj -scheme Auvel \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AuvelUITests/RealMacUITests \
            -resultBundlePath E2E.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Print test failures
        if: failure()
        working-directory: ios
        run: |
          [ -d E2E.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path E2E.xcresult --compact | python3 -c '
          import json, sys
          def walk(node, path):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print(" / ".join(path), "->", name)
              here = path + [name] if node.get("nodeType") in ("Test Case", "Test Suite") else path
              for child in node.get("children", []):
                  walk(child, here)
          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node, [])
          '
      - name: Mac app log
        if: always()
        run: log show --last 15m --style compact --predicate 'process == "AuvelMac"' | grep -v "^Filtering" | tail -200
