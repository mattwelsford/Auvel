name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared package (build + test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --package-path shared
      - name: Test
        run: swift test --package-path shared

  app:
    name: ${{ matrix.name }} app (build)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            dir: mac
            project: AuvelMac.xcodeproj
            scheme: AuvelMac
            destination: generic/platform=macOS
          - name: iPhone
            dir: ios
            project: Auvel.xcodeproj
            scheme: Auvel
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ${{ matrix.dir }}
        run: xcodegen generate
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          xcodebuild build \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO
